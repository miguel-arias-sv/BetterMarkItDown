name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The OCR extra is heavy and not needed for the offline suite.
          pip install "markitdown[pdf]" openai pymupdf pillow rich pytest ruff

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install KaTeX
        # Optional at runtime; installed here so the math render test runs instead of skipping.
        run: npm ci

      - name: Lint
        run: ruff check bettermarkitdown tests

      - name: Test
        run: python -m pytest tests -q
        # No API key is configured: every test in the suite runs offline.
