name: release

# Push a tag like v1.2.0 to publish a GitHub Release: the wheel and source archive are
# built, tested, and attached, and the version's section of CHANGELOG.md becomes the
# release notes. Run it by hand (Actions tab -> release -> Run workflow) for a dry run
# that builds and prints the notes without publishing anything.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Release notes (checks the tag matches __version__ and CHANGELOG.md)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          else
            python scripts/release_notes.py > notes.md
          fi
          cat notes.md

      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: Test the built wheel
        run: |
          pip install dist/*.whl pytest
          bettermarkitdown --version
          python -m pytest tests -q

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "BetterMarkItDown ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag

  installer:
    # The Windows installer: built, installed and uninstalled on a clean machine, then
    # attached to the release (or kept as a workflow artifact on a dry run).
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        run: |
          python -m pip install --upgrade pip pillow
          python installer/build.py

      # Code signing by SignPath Foundation (see CODE_SIGNING_POLICY.md). Skipped until the
      # repository has the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
      # SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN; then each signing
      # request waits for the maintainer's approval in SignPath, and the signed installer
      # replaces the unsigned one before it is tested and published.
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: dist/BetterMarkItDown-Setup-*.exe

      - name: Sign it (SignPath)
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600     # approval is by hand
          output-artifact-directory: signed

      - name: Use the signed installer
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Filter "BetterMarkItDown-Setup-*.exe" -Recurse | Select-Object -First 1
          if (-not $signed) { Write-Error "SignPath returned no installer"; exit 1 }
          $sig = Get-AuthenticodeSignature $signed.FullName
          "signature: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { Write-Error "the installer is not validly signed"; exit 1 }
          Copy-Item $signed.FullName dist -Force

      - name: Install it, try it, uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "BetterMarkItDown-Setup-*.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="addtopath,ocr"','/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 40; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\BetterMarkItDown"
          Get-Content "$app\install.log" -Tail 5
          & "$app\bin\bettermarkitdown.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$app\bin\bettermarkitdown.exe" doctor
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (-not (($path -split ';') -contains "$app\bin")) { Write-Error "bin is not on the PATH"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\BetterMarkItDown.lnk")) { Write-Error "no Start-menu entry"; exit 1 }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -contains "$app\bin") { Write-Error "uninstall left bin on the PATH"; exit 1 }
          if (Test-Path "$app\bin") { Write-Error "uninstall left the program behind"; exit 1 }
          "installed, ran and uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/BetterMarkItDown-Setup-*.exe

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist -Filter "BetterMarkItDown-Setup-*.exe").FullName
